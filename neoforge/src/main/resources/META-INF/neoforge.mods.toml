modLoader = "javafml"
loaderVersion = "[4,)"
license = "CC0-1.0"
issueTrackerURL = "https://github.com/polyvenom/tradepicker/issues"

[[mods]]
modId = "tradeoptimizer"
version = "${version}"
displayName = "Trade Picker"
description = '''Pick the exact villager trades you want, at vanilla's lowest price. Choose two trades from the full pool at each level, no workstation breaking or RNG. Reset any villager to start over.'''
authors = "polyvenom"
displayURL = "https://github.com/polyvenom/tradepicker"
logoFile = "assets/tradeoptimizer/icon.png"

# Mixins (annotation processor wired automatically by ModDevGradle). NeoForge runs on
# Mojmaps so these need no refmap.
[[mixins]]
config = "tradeoptimizer.mixins.json"

[[mixins]]
config = "tradeoptimizer.client.mixins.json"

# Constrained to the 26.1.x lineage; a 26.2 build will ship as a separate release.
[[dependencies.tradeoptimizer]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2,26.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tradeoptimizer]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2,26.2)"
ordering = "NONE"
side = "BOTH"
