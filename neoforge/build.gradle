plugins {
	id 'net.neoforged.moddev' version "${mdg_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "tradeoptimizer-neoforge"
}

// Dedicated source set for game tests, kept out of the production jar.
sourceSets {
	gameTest
}

neoForge {
	version = project.neoforge_version

	addModdingDependenciesTo sourceSets.gameTest

	mods {
		tradeoptimizer {
			sourceSet sourceSets.main
			sourceSet sourceSets.gameTest
		}
	}

	runs {
		// ./gradlew runGameTest: a headless gameTestServer that runs every registered @GameTest
		// and exits non-zero on failure.
		gameTest {
			type = "gameTestServer"
			gameDirectory = file("build/gametest")
		}
	}
}

// 21.1 loads @GameTest SNBT templates from a `gameteststructures/<path>.snbt` directory relative
// to the server's working dir (the namespace is dropped by the SNBT loader), so stage our empty
// arena there before the gameTestServer starts.
def stageGameTestStructures = tasks.register('stageGameTestStructures', Copy) {
	from(file("src/gameTest/structures"))
	into(file("build/gametest/gameteststructures"))
}
tasks.matching { it.name == 'runGameTest' }.configureEach {
	dependsOn stageGameTestStructures
}

// Source-sharing: NeoForge uses a single source set (client code is guarded at runtime via
// Dist), so both common/src/main/java and common/src/client/java compile here.
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.java.srcDir project(':common').file('src/client/java')

// Substitute ${version} in neoforge.mods.toml with the gradle mod_version.
processResources {
	def v = project.version
	inputs.property "version", v
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": v
	}
}

// The gametest source set gets everything main has plus main's compiled output.
sourceSets.gameTest.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.gameTest.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

// Java 21 bytecode; JDK 25 is the installed toolchain.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// ModDevGradle defaults its run/asset tasks to a Java 21 toolchain, but only JDK 25 is
// installed (the tools are 21 bytecode and run fine on 25), so force every MDG task onto it.
def jdk25Launcher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(25)
}
tasks.configureEach { t ->
	if (t.hasProperty('javaLauncher')) {
		t.javaLauncher.set(jdk25Launcher)
	}
	if (t.hasProperty('javaExecutable')) {
		t.javaExecutable.set(jdk25Launcher.map { it.executablePath.asFile.absolutePath })
	}
	// MDG's createMinecraftArtifacts exposes its JDK path under this third property name.
	if (t.hasProperty('toolsJavaExecutable')) {
		t.toolsJavaExecutable.set(jdk25Launcher.map { it.executablePath.asFile.absolutePath })
	}
}
