plugins {
	id 'net.neoforged.moddev' version "${mdg_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "tradeoptimizer-neoforge"
}

// Game tests live in their own source set, kept out of the production jar.
sourceSets {
	gameTest
}

// Shares the Fabric game-test classes (the GameTest annotation is stubbed here).
sourceSets.gameTest.java.srcDir project(':fabric').file('src/gametest/java')

neoForge {
	version = project.neoforge_version

	addModdingDependenciesTo sourceSets.gameTest

	mods {
		tradeoptimizer {
			sourceSet sourceSets.main
			sourceSet sourceSets.gameTest
		}
	}

	runs {
		// Headless gameTestServer: runs every registered @GameTest, exits non-zero on failure.
		gameTest {
			type = "gameTestServer"
		}
	}
}

// Compile :common into this jar. NeoForge uses a single source set (client code is guarded at
// runtime via Dist), so both common source roots are compiled here.
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.main.java.srcDir project(':common').file('src/client/java')
// Shared resources: the mixin configs and the lang file.
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

// Substitute ${version} in neoforge.mods.toml with mod_version.
processResources {
	def v = project.version
	inputs.property "version", v
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": v
	}
}

// The gametest set sees everything main has, plus main's output.
sourceSets.gameTest.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.gameTest.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

// NeoForge's runtime stack is Java 25 bytecode, so this artifact must target 25 to resolve it.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// ModDevGradle defaults its run/asset tasks to a Java 21 toolchain, but NeoForge's libraries are
// Java 25 bytecode (and the Java-21 asset tool runs fine on 25). Force every MDG task onto JDK 25
// so no separate JDK 21 is needed.
def jdk25Launcher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(25)
}
tasks.configureEach { t ->
	if (t.hasProperty('javaLauncher')) {
		t.javaLauncher.set(jdk25Launcher)
	}
	if (t.hasProperty('javaExecutable')) {
		t.javaExecutable.set(jdk25Launcher.map { it.executablePath.asFile.absolutePath })
	}
}

// Ship the licence like the Fabric jar does.
jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_tradeoptimizer" }
	}
}
