plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	// Only names the output jar; the mod id inside fabric.mod.json stays "tradeoptimizer".
	// Suffixed so the Fabric and NeoForge artifacts are distinguishable in build/libs.
	archivesName = "tradeoptimizer-fabric"
}

repositories {
	// Terraformers maven hosts ModMenu — compile-only dep for the optional integration.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

// Dedicated source set for game tests — keeps the test code and its entrypoint out
// of the production main/client jars. Its classpath is wired to main's below.
sourceSets {
	gametest {}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tradeoptimizer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		// Separate mod id so the gametest source set's own fabric.mod.json (which
		// declares the fabric-gametest entrypoint) is only loaded in the test run.
		"tradeoptimizer-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// ./gradlew runGametest — boots a headless dedicated server, runs every
		// @GameTest in the gametest source set against REAL Minecraft, writes a
		// JUnit XML report, and exits non-zero if any test fails. Unlike the
		// fabric-loader-junit harness, this cannot diverge from runtime behaviour.
		gametest {
			server()
			name = "Trade Picker Game Test"
			source "gametest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=" + layout.buildDirectory.file("gametest/report.xml").get().asFile
			runDir "build/gametest"
		}
	}
}

// Source-sharing: compile the shared :common code into this Fabric jar. Common's main
// (server + common logic) joins Fabric's main source set; common's client joins Fabric's
// client set (so client-only Minecraft types resolve). It is recompiled here against Loom's
// Mojmapped Minecraft, so no cross-project remapping is needed, and Loom's mixin annotation
// processor still runs over any shared mixin sources.
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.client.java.srcDir project(':common').file('src/client/java')

// Give the gametest source set everything main has (Minecraft, Fabric API, and the
// remapped gametest API via modImplementation) plus main's compiled output.
sourceSets.gametest.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.gametest.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

// 1.21.1 is an obfuscated target (unlike the 26.x Mojmap-native line), so mod deps for the
// gametest source set need their own remap-aware configurations (modGametestImplementation).
// MUST come after loom knows the minecraft version is an obfuscated one — calling it inside
// the loom{} block (before the minecraft dependency exists) trips Loom's "non-obfuscated
// environment" guard.
loom.createRemapConfigurations(sourceSets.gametest)

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.1 is obfuscated — mappings + remapping return (the 26.x line was Mojmap-native
	// and rejected this line; on this branch it is REQUIRED).
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Soft optional — present at compile-time so TradePickerMenuApi resolves; absent
	// at runtime unless the user installs ModMenu.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Unit-test harness (skipped in CI builds with -x test).
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"

	// Game-test framework, scoped to the gametest source set via the remap-aware
	// configuration from createRemapConfigurations. Never reaches the release jar.
	modGametestImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:${project.gametest_api_version}"
}

test {
	useJUnitPlatform()
	// Loom remaps the test classpath to named (Mojmap) Minecraft, matching src/main.
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	// LICENSE now lives at the repository root, not beside this build file.
	from(rootProject.file("LICENSE")) {
		rename { "${it}_tradeoptimizer" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}