plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	// Only names the output jar; the mod id inside fabric.mod.json stays "tradeoptimizer".
	// Suffixed so the Fabric and NeoForge artifacts are distinguishable in build/libs.
	archivesName = "tradeoptimizer-fabric"
}

repositories {
	// Terraformers maven hosts ModMenu — compile-only dep for the optional integration.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

// Dedicated source set for game tests — keeps the test code and its entrypoint out
// of the production main/client jars. Its classpath is wired to main's below.
sourceSets {
	gametest {}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tradeoptimizer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		// Separate mod id so the gametest source set's own fabric.mod.json (which
		// declares the fabric-gametest entrypoint) is only loaded in the test run.
		"tradeoptimizer-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// ./gradlew runGametest — boots a headless dedicated server, runs every
		// @GameTest in the gametest source set against REAL Minecraft, writes a
		// JUnit XML report, and exits non-zero if any test fails. Unlike the
		// fabric-loader-junit harness, this cannot diverge from runtime behaviour.
		gametest {
			server()
			name = "Trade Picker Game Test"
			source "gametest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=" + layout.buildDirectory.file("gametest/report.xml").get().asFile
			runDir "build/gametest"
		}
	}
}

// Give the gametest source set everything main has (Minecraft, Fabric API, and the
// remapped gametest API via modImplementation) plus main's compiled output.
sourceSets.gametest.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.gametest.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Soft optional — present at compile-time so TradePickerMenuApi resolves; absent
	// at runtime unless the user installs ModMenu.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Unit-test harness. fabric-loader-junit boots a headless Fabric/Minecraft
	// environment inside JUnit so tests can touch net.minecraft.* classes
	// (Identifier, registries, codecs) without launching the game. It transitively
	// pulls JUnit 5; the explicit jupiter dep just pins assertions/params API.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"

	// Game-test framework, scoped to the gametest source set only (matches this
	// project's convention of plain `implementation` for Fabric mod deps — see
	// fabric-api above). Not on main/client, so it never reaches the release jar.
	gametestImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:${project.gametest_api_version}"
}

test {
	useJUnitPlatform()
	// Loom remaps the test classpath to named (Mojmap) Minecraft, matching src/main.
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	// LICENSE now lives at the repository root, not beside this build file.
	from(rootProject.file("LICENSE")) {
		rename { "${it}_tradeoptimizer" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}