plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	// Only names the output jar (the mod id stays "tradeoptimizer"); the suffix tells the
	// Fabric and NeoForge artifacts apart in build/libs.
	archivesName = "tradeoptimizer-fabric"
}

repositories {
	// Terraformers maven hosts ModMenu — compile-only dep for the optional integration.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

// Game tests live in their own source set, out of the production jars.
sourceSets {
	gametest {}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tradeoptimizer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		// Separate mod id so the gametest fabric.mod.json (fabric-gametest entrypoint) loads only in the test run.
		"tradeoptimizer-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// Headless dedicated server running every @GameTest against real Minecraft; writes a
		// JUnit XML report and exits non-zero on failure.
		gametest {
			server()
			name = "Trade Picker Game Test"
			source "gametest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=" + layout.buildDirectory.file("gametest/report.xml").get().asFile
			runDir "build/gametest"
		}
	}
}

// Compile :common into this jar: its main joins Fabric's main source set, its client joins the
// client set (so client-only Minecraft types resolve). Recompiling against Loom's Minecraft
// needs no cross-project remapping and keeps Loom's mixin annotation processor running.
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.client.java.srcDir project(':common').file('src/client/java')
// Shared resources: the mixin configs and the lang file.
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

// The gametest set sees everything main has, plus main's output.
sourceSets.gametest.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.gametest.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Soft optional: compile-time only, so TradePickerMenuApi resolves.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// fabric-loader-junit boots a headless Minecraft inside JUnit; the explicit jupiter dep pins the API.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"

	// Game-test framework: gametest source set only, so it never reaches the release jar.
	gametestImplementation fabricApi.module("fabric-gametest-api-v1", project.fabric_api_version)
}

test {
	useJUnitPlatform()
	// Loom remaps the test classpath to named (Mojmap) Minecraft, matching src/main.
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	from(rootProject.file("LICENSE")) {
		rename { "${it}_tradeoptimizer" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}