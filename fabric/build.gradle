plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	// Only names the output jar (the mod id stays "tradeoptimizer"); the suffix tells the Fabric
	// and NeoForge artifacts apart in build/libs.
	archivesName = "tradeoptimizer-fabric"
}

repositories {
	// Terraformers maven hosts ModMenu — compile-only dep for the optional integration.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

// Dedicated source set for game tests, kept out of the production jars.
sourceSets {
	gametest {}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tradeoptimizer" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
		// Separate mod id so the gametest fabric.mod.json (fabric-gametest entrypoint) only loads in the test run.
		"tradeoptimizer-gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		// ./gradlew runGametest: boots a headless dedicated server, runs every @GameTest in the
		// gametest source set against real Minecraft, writes a JUnit XML report, and exits non-zero
		// on failure.
		gametest {
			server()
			name = "Trade Picker Game Test"
			source "gametest"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=" + layout.buildDirectory.file("gametest/report.xml").get().asFile
			runDir "build/gametest"
		}
	}
}

// Source-sharing: :common's main joins Fabric's main source set and its client joins the client
// set (so client-only Minecraft types resolve), recompiled against Loom's Minecraft. Loom's mixin
// annotation processor still runs over the shared mixin sources.
sourceSets.main.java.srcDir project(':common').file('src/main/java')
sourceSets.client.java.srcDir project(':common').file('src/client/java')
// Shared lang file.
sourceSets.main.resources.srcDir project(':common').file('src/main/resources')

// The gametest source set gets everything main has plus main's compiled output.
sourceSets.gametest.compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
sourceSets.gametest.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output

// This MC line is obfuscated, so mod deps for the gametest source set need remap-aware
// configurations (modGametestImplementation). Must stay outside the loom{} block: before the
// minecraft dependency exists it trips Loom's "non-obfuscated environment" guard.
loom.createRemapConfigurations(sourceSets.gametest)

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Obfuscated MC line: mappings and remapping are required.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Soft optional: compile-time only, so TradePickerMenuApi resolves.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Unit-test harness (skipped in CI builds with -x test).
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"

	// Game-test framework, scoped to the gametest source set; never reaches the release jar.
	modGametestImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:${project.gametest_api_version}"
}

test {
	useJUnitPlatform()
	// Loom remaps the test classpath to named (Mojmap) Minecraft, matching src/main.
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	// LICENSE lives at the repository root.
	from(rootProject.file("LICENSE")) {
		rename { "${it}_tradeoptimizer" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}