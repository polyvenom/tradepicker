# ModDevGradle's NeoForm decompilation of Minecraft needs more heap than a Fabric-only build.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=1.21.1
loader_version=0.19.3
# Loom 1.16+ is Mojmap-native-only; this MC line needs a remap-capable Loom.
loom_version=1.14.10

# Mod Properties
mod_version=1.7.2+mc1.21.1
maven_group=com.tom.tradeoptimizer

# Dependencies
fabric_api_version=0.116.12+1.21.1

# NeoForge / multi-loader (ModDevGradle build tool, used by :common and :neoforge only).
# :common compiles against vanilla Mojmapped Minecraft via NeoForm; :neoforge against NeoForge.
mdg_version=2.0.141
neoforge_version=21.1.233
neoform_version=1.21.1-20240808.144430

# Test
junit_version=5.11.3
# Fabric game-test module for this remapped line (not the 4.x Mojmap-native one).
gametest_api_version=2.0.5+6fc22b9919

# Soft-optional ModMenu integration. Compile-only; users don't need ModMenu installed.
modmenu_version=11.0.4
