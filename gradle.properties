# Done to increase the memory available to gradle. Bumped from 1G: ModDevGradle's
# NeoForm decompilation of Minecraft needs noticeably more heap than the Fabric-only build.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
minecraft_version=26.1.2
loader_version=0.19.2
loom_version=1.16-SNAPSHOT

# Mod Properties
mod_version=1.3.0-dev1
maven_group=com.tom.tradeoptimizer

# Dependencies
fabric_api_version=0.149.1+26.1.2

# NeoForge / multi-loader (ModDevGradle build tool, used by :common and :neoforge only).
# :common compiles against vanilla Mojmapped Minecraft via NeoForm; :neoforge against NeoForge.
mdg_version=2.0.141
neoforge_version=26.1.2.75
neoform_version=26.1.2-1

# Test
junit_version=5.11.3
# Game-test module that matches fabric-api 0.149.1+26.1.2 (its deps resolve to the
# exact module builds bundled there: fabric-api-base 2.0.3+ece063234c etc.).
gametest_api_version=4.0.16+867b87624c

# Soft-optional ModMenu integration. Compile-only; users don't need ModMenu installed.
modmenu_version=18.0.0-beta.1