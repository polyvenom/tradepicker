# Done to increase the memory available to gradle. Bumped from 1G: ModDevGradle's
# NeoForm decompilation of Minecraft needs noticeably more heap than the Fabric-only build.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties — 1.21.1 backport line (the modpack LTS target: ATM10-era NeoForge
# ecosystem lives on 1.21.1, and Fabric API / NeoForge both still patch this line).
minecraft_version=1.21.4
loader_version=0.19.3
# Loom 1.16+ is Mojmap-native-only (no obfuscated-target support) — 1.21.1 needs a
# remap-capable Loom. 1.15.x is the newest line that still does both.
loom_version=1.14.10

# Mod Properties
mod_version=1.3.0+mc1.21.4
maven_group=com.tom.tradeoptimizer

# Dependencies
fabric_api_version=0.119.4+1.21.4

# NeoForge / multi-loader (ModDevGradle build tool, used by :common and :neoforge only).
# :common compiles against vanilla Mojmapped Minecraft via NeoForm; :neoforge against NeoForge.
# 21.1.x is the still-patched NeoForge LTS line for MC 1.21.1.
mdg_version=2.0.141
neoforge_version=21.2.1-beta
neoform_version=1.21.2-20241022

# Test
junit_version=5.11.3
# Game-test module bundled inside fabric-api 0.116.12+1.21.1 (1.21.1 line, NOT the 4.x
# module that belongs to the 26.x branch).
gametest_api_version=2.0.26+7feeb73304

# Soft-optional ModMenu integration. Compile-only; users don't need ModMenu installed.
# 11.0.x is the MC 1.21/1.21.1 line.
modmenu_version=13.0.4
