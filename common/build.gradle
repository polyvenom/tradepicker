plugins {
	id 'net.neoforged.moddev' version "${mdg_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "tradeoptimizer-common"
}

neoForge {
	// Vanilla Mojmapped Minecraft only — NO loader. This module holds the loader-agnostic
	// logic. Its compiled jar is not shipped; each loader module recompiles common's SOURCE
	// against its own Mojmapped Minecraft (source-sharing). This config exists so :common
	// compiles/validates standalone and IDEs resolve net.minecraft.* types.
	neoFormVersion = project.neoform_version
}

// Client-side shared code (UI, client networking seam) lives under src/client/java. NeoForm
// provides the full client Minecraft, so :common compiles it in one pass. The loader modules
// map this directory to their own client source set (Fabric) or single set (NeoForge).
sourceSets {
	main {
		java.srcDir 'src/client/java'
	}
}

// Java 25 — both MC 26.1.2 loaders are Java 25 platforms (NeoForge 26.1.2's own runtime
// stack, FancyModLoader/NeoForm, ships Java 25 bytecode), so the whole project is uniform 25.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Same JDK-25 override as :neoforge — MDG tool/run tasks default to a Java 21 toolchain, and
// only JDK 25 is installed (the tools are 21-bytecode and run fine on 25).
def jdk25Launcher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(25)
}
tasks.configureEach { t ->
	if (t.hasProperty('javaLauncher')) {
		t.javaLauncher.set(jdk25Launcher)
	}
	if (t.hasProperty('javaExecutable')) {
		t.javaExecutable.set(jdk25Launcher.map { it.executablePath.asFile.absolutePath })
	}
	if (t.hasProperty('toolsJavaExecutable')) {
		t.toolsJavaExecutable.set(jdk25Launcher.map { it.executablePath.asFile.absolutePath })
	}
}
