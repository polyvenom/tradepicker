plugins {
	id 'net.neoforged.moddev' version "${mdg_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "tradeoptimizer-common"
}

neoForge {
	// Vanilla Mojmapped Minecraft, no loader. This jar is not shipped: each loader module
	// recompiles common's source against its own Minecraft. This config lets :common compile
	// standalone and IDEs resolve net.minecraft.* types.
	neoFormVersion = project.neoform_version
}

// Compile-only Mixin annotations for the shared mixins; each loader supplies the runtime.
repositories {
	maven { url = "https://maven.fabricmc.net/" }
}
dependencies {
	compileOnly "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
}

// Client-side shared code lives under src/client/java; NeoForm provides client Minecraft, so
// :common compiles it in one pass. Fabric maps it to its client source set, NeoForge to main.
sourceSets {
	main {
		java.srcDir 'src/client/java'
	}
}

// Java 25: both loaders' runtime stacks ship Java 25 bytecode, so the whole project targets 25.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
