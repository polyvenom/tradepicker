plugins {
	id 'net.neoforged.moddev' version "${mdg_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "tradeoptimizer-common"
}

neoForge {
	// Vanilla Mojmapped Minecraft only, no loader. Its jar is not shipped: each loader module
	// recompiles common's SOURCE against its own Minecraft. This config lets :common compile
	// standalone and IDEs resolve net.minecraft.* types.
	neoFormVersion = project.neoform_version
}

// The shared mixin interface needs the Mixin annotations to compile here. Compile-only: Fabric
// supplies its own Mixin runtime.
repositories {
	maven { url = "https://maven.fabricmc.net/" }
}
dependencies {
	compileOnly "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
}

// Client-side shared code lives under src/client/java; NeoForm provides the full client
// Minecraft, so :common compiles it in one pass.
sourceSets {
	main {
		java.srcDir 'src/client/java'
	}
}

// Java 21 bytecode; JDK 25 is the installed toolchain.
tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// MDG tool/run tasks default to a Java 21 toolchain, but only JDK 25 is installed (the tools are
// 21 bytecode and run fine on 25).
def jdk25Launcher = javaToolchains.launcherFor {
	languageVersion = JavaLanguageVersion.of(25)
}
tasks.configureEach { t ->
	if (t.hasProperty('javaLauncher')) {
		t.javaLauncher.set(jdk25Launcher)
	}
	if (t.hasProperty('javaExecutable')) {
		t.javaExecutable.set(jdk25Launcher.map { it.executablePath.asFile.absolutePath })
	}
	if (t.hasProperty('toolsJavaExecutable')) {
		t.toolsJavaExecutable.set(jdk25Launcher.map { it.executablePath.asFile.absolutePath })
	}
}
